name: Publish clean cloud base

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-base-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsecret-1-dev python3
      - run: bun install --frozen-lockfile
      - name: Prepare runtime artifacts
        run: bash infra/cloud-sandboxes/prepare-artifacts.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Choose immutable release tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=ghcr.io/${REPOSITORY,,}/cloud-base:sha-${GITHUB_SHA}-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: infra/cloud-sandboxes
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify clean base
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm --network=none --user root \
            --mount "type=bind,source=$PWD/infra/cloud-sandboxes/verify-clean-base.sh,target=/verify-clean-base.sh,readonly" \
            "$IMAGE" bash /verify-clean-base.sh
      - name: Publish verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker push "$IMAGE"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          printf 'DAYTONA_BYOK_IMAGE=%s\nDAYTONA_TEMPLATE_VERSION=%s\n' "$DIGEST_REF" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '\nVerify anonymous pulls (GHCR package visibility must be public) before configuring staging. This workflow does not deploy the API or change existing sandboxes.\n' >> "$GITHUB_STEP_SUMMARY"
