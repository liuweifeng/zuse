name: Native Android
on:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/contracts/src/deployment-profiles.json"
      - "packages/utils/src/generative-ui.ts"
      - "packages/utils/package.json"
      - "apps/renderer/package.json"
      - "bun.lock"
      - "apps/web/public/models/v1.json"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --filter @zuse/utils --filter renderer --ignore-scripts --frozen-lockfile
      - run: bun apps/android/scripts/generate-assets.mjs
      - run: git diff --exit-code -- apps/android/app/src/main/assets/native apps/android/app/src/debug/assets/native
      - run: bun run --cwd packages/utils check-types
      - run: bun run --cwd packages/utils test:unit
      - run: bunx @biomejs/biome@2.5.3 check biome.jsonc apps/android/scripts packages/utils/src/generative-ui.ts packages/utils/test/unit/generative-ui.test.ts
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkKotlinFormat :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: zuse-native-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/screenshots/
            apps/android/app/build/reports/tests/
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-device-test-results
          path: apps/android/app/build/reports/androidTests/
