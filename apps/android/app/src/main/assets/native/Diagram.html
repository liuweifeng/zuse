<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><style>:root{color-scheme:light dark}body{margin:12px;font:14px sans-serif;background:transparent}svg{max-width:none}#error{white-space:pre-wrap}#diagram{width:max-content;min-width:100%}</style></head><body><div id="diagram"></div><pre id="error"></pre><script src="Mermaid.js"></script><script>
mermaid.initialize({startOnLoad:false,securityLevel:'strict',maxTextSize:32768,maxEdges:512,secure:['securityLevel','maxTextSize','maxEdges','startOnLoad','secure'],theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default',flowchart:{htmlLabels:false}});
let sequence=0;
async function renderDiagram(source,dark){if(typeof dark==='boolean'){document.documentElement.style.colorScheme=dark?'dark':'light';mermaid.initialize({startOnLoad:false,securityLevel:'strict',maxTextSize:32768,maxEdges:512,secure:['securityLevel','maxTextSize','maxEdges','startOnLoad','secure'],theme:dark?'dark':'default',flowchart:{htmlLabels:false}});}const version=++sequence;const error=document.getElementById('error');error.textContent='';try{if(source.length>32768)throw new Error('Diagram exceeds the rendering limit.');const result=await mermaid.render('diagram-'+version,source);if(version===sequence)document.getElementById('diagram').innerHTML=result.svg;}catch(e){if(version===sequence){document.getElementById('diagram').textContent='';error.textContent='Unable to render diagram.\n'+source;}}}
</script></body></html>
