plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.zuse.mobileplatform'
version = '1.0.0'

android {
  namespace 'com.zuse.mobileplatform'

  defaultConfig {
    minSdk 24
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.17.0'
}
